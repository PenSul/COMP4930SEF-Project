[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tensorflow.*", "keras.*", "PIL.*"]
follow_imports = "skip"
